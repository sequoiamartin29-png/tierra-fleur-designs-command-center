      .startup-shell{box-sizing:border-box;display:grid;min-height:100vh;place-items:center;padding:24px;background:#f4eee4;color:#31483a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.startup-card{width:min(620px,100%);border:1px solid #d8cab6;border-radius:22px;padding:28px;background:#fffaf2;box-shadow:0 18px 48px rgba(50,62,49,.14)}.startup-card span{color:#8a6c40;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.startup-card h1{margin:8px 0 10px;font:700 30px Georgia,serif}.startup-card p{margin:0;color:#667066;line-height:1.55}.startup-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.startup-actions button{min-height:44px;border:1px solid #bda981;border-radius:12px;padding:9px 14px;background:#fff;color:#344a39;font-weight:750}.startup-actions button:first-child{background:#596b52;color:#fff}.startup-detail{margin-top:16px;color:#79534a;font-size:12px;overflow-wrap:anywhere}

    <script>
      (function () {
        if (window.location.protocol === 'file:') {
          var showLocalPreviewGuidance = function () {
            var root = document.getElementById('root');
            if (!root) return;
            root.innerHTML = '<main class="startup-shell"><section class="startup-card" role="status"><span>Local preview required</span><h1>Open this build through a web server.</h1><p>This production build cannot be started by double-clicking <strong>dist/index.html</strong>. Browsers restrict JavaScript modules and application storage on <strong>file://</strong> pages. Run <strong>npm run preview</strong> and open the local address Vite provides, or use the published Netlify site.</p></section></main>';
          };
          if (document.getElementById('root')) showLocalPreviewGuidance();
          else document.addEventListener('DOMContentLoaded', showLocalPreviewGuidance, { once: true });
          return;
        }

        var cryptoApi = window.crypto || window.msCrypto;
        if (cryptoApi && typeof cryptoApi.randomUUID !== 'function') {
          var uuidFallback = function () {
            var bytes = new Uint8Array(16);
            if (typeof cryptoApi.getRandomValues === 'function') cryptoApi.getRandomValues(bytes);
            else for (var index = 0; index < bytes.length; index += 1) bytes[index] = Math.floor(Math.random() * 256);
            bytes[6] = (bytes[6] & 15) | 64;
            bytes[8] = (bytes[8] & 63) | 128;
            var hex = [];
            for (var byteIndex = 0; byteIndex < bytes.length; byteIndex += 1) hex.push((bytes[byteIndex] + 256).toString(16).slice(1));
            return hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' + hex.slice(6, 8).join('') + '-' + hex.slice(8, 10).join('') + '-' + hex.slice(10).join('');
          };
          try {
            Object.defineProperty(cryptoApi, 'randomUUID', { configurable: true, value: uuidFallback });
          } catch (error) {
            try { cryptoApi.randomUUID = uuidFallback; } catch (assignmentError) { /* Startup recovery below handles this browser. */ }
          }
        }

        var startupTimer;
        var startupFailure;
        window.__TF_DOWNLOAD_RECOVERY__ = function (rawValue) {
          try {
            var stored = typeof rawValue === 'string' ? rawValue : window.localStorage.getItem('tierraFleurCommandCenterV1');
            var payload;
            var fileName = 'tierra-fleur-preserved-data.json';
            try {
              payload = stored ? JSON.stringify(JSON.parse(stored), null, 2) : JSON.stringify({}, null, 2);
            } catch (parseError) {
              fileName = 'tierra-fleur-startup-recovery.json';
              payload = JSON.stringify({
                format: 'tierra-fleur-startup-recovery',
                capturedAt: new Date().toISOString(),
                storageKey: 'tierraFleurCommandCenterV1',
                rawApplicationData: stored || ''
              }, null, 2);
            }
            var link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
            return true;
          } catch (error) {
            return false;
          }
        };
        window.__TF_STARTUP_READY__ = function () {
          window.__TF_APP_MOUNTED__ = true;
          clearTimeout(startupTimer);
        };
        window.__TF_SHOW_STARTUP_ERROR__ = function (reason) {
          if (window.__TF_APP_MOUNTED__ || startupFailure) return;
          startupFailure = reason || new Error('The application did not finish opening.');
          clearTimeout(startupTimer);
          var show = function () {
            var root = document.getElementById('root');
            if (!root) return;
            var message = startupFailure && startupFailure.message ? startupFailure.message : String(startupFailure || 'Unknown startup error');
            root.innerHTML = '<main class="startup-shell"><section class="startup-card" role="alert"><span>Startup recovery</span><h1>Tierra Fleur could not finish opening.</h1><p>Your saved records have not been deleted or reset. Property-photo attachments remain untouched in device storage. You can reload the app or download the preserved local record before troubleshooting.</p><div class="startup-actions"><button type="button" id="startup-reload">Try opening again</button><button type="button" id="startup-backup">Download preserved data</button></div><p class="startup-detail" id="startup-detail"></p></section></main>';
            document.getElementById('startup-detail').textContent = message;
            document.getElementById('startup-reload').onclick = function () { window.location.reload(); };
            document.getElementById('startup-backup').onclick = function () {
              if (!window.__TF_DOWNLOAD_RECOVERY__()) document.getElementById('startup-detail').textContent = message + ' The browser also blocked access to the local backup.';
            };
          };
          if (document.getElementById('root')) show();
          else document.addEventListener('DOMContentLoaded', show, { once: true });
        };
        window.addEventListener('error', function (event) {
          var target = event.target;
          var asset = target && (target.src || target.href);
          window.__TF_SHOW_STARTUP_ERROR__(event.error || new Error(event.message || (asset ? 'A required application file could not be loaded: ' + asset : 'A startup error occurred.')));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          window.__TF_SHOW_STARTUP_ERROR__(event.reason || new Error('A startup task failed.'));
        });
        document.addEventListener('DOMContentLoaded', function () {
          startupTimer = setTimeout(function () { window.__TF_SHOW_STARTUP_ERROR__(new Error('The application took too long to start.')); }, 10000);
        }, { once: true });
      }());
    </script>
